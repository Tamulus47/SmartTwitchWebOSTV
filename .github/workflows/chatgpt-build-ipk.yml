name: Build webOS IPK (temporary)
on:
  push:
    branches:
      - chatgpt-build-ipk-2026-11-25
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare hosted release
        run: npm run hosted:prepare
      - name: Lint
        run: npm run lint
      - name: Package webOS app
        run: npm run webos:package
      - name: Generate release metadata
        run: npm run release:artifacts
      - name: Upload IPK and metadata
        uses: actions/upload-artifact@v4
        with:
          name: SmartTwitchWebOSTV-webOS-v1.1.0
          path: |
            build/*.ipk
            build/*.manifest.json
            build/*.apps-repo.yml
          if-no-files-found: error
          retention-days: 7
